function mult(sym,price){sym=(sym||'').toUpperCase();const ci=(S.inst||{})[sym];if(ci)return ci.pv/ci.unit;if(/XAU|GOLD/.test(sym))return 100;if(/XAG|SILVER/.test(sym))return 5000;if(/XPT|XPD/.test(sym))return 100;if(/XTI|XBR|WTI|BRENT|OIL/.test(sym))return 1000;if(/XNG/.test(sym))return 10000;if(/BTC|ETH|SOL|XRP|LTC|BNB|DOGE|ADA/.test(sym))return 1;if(/NAS|US30|SPX|DAX|US100|GER|UK100|NDX|DJI/.test(sym))return 1;if(/^[A-Z]{6}$/.test(sym))return /JPY$/.test(sym)?100000/(price||150):(sym.startsWith('USD')?100000/(price||1):100000);return 1}

 ({dash:vDash,new:vForm,journal:vJournal,strat:vStrat,note:vNote,news:vNews,calc:vCalc,settings:vSettings})[view]();applyBtn()}

function stats(L){const c=L.filter(t=>t.pnl!=null),w=c.filter(t=>t.pnl>0),l=c.filter(t=>t.pnl<0),gp=w.reduce((a,t)=>a+t.pnl,0),gl=-l.reduce((a,t)=>a+t.pnl,0),rs=c.filter(t=>t.rr);

// ---- local accounts (encrypted, browser-only) ----
let USER=null,USERD='',KEY=null,SALT=null;const enc=new TextEncoder,dec=new TextDecoder;
const idb=(()=>{let p;return()=>p||(p=new Promise((res,rej)=>{const q=indexedDB.open('tjpub',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}))})();
const kv=async(m,k,v)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('kv',m==='get'?'readonly':'readwrite'),st=t.objectStore('kv'),q=m==='get'?st.get(k):st.put(v,k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})};
async function derive(pw,salt){const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(){const iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},KEY,enc.encode(JSON.stringify(MEM)));await kv('put','u:'+USER,{salt:SALT,iv,ct,name:USERD})}
function schedFlush(){clearTimeout(PT);PT=setTimeout(flush,400)}
async function flush(){if(!KEY)return;try{await seal()}catch(e){toast('Could not save — browser storage may be full or blocked.')}}

function vAuth(mode){const n=mode==='new';let a=$('#auth');if(!a){a=document.createElement('div');a.id='auth';a.style.cssText='position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto';document.body.appendChild(a)}
 a.innerHTML=`<div style="width:100%;max-width:380px;margin-top:6vh"><div style="text-align:center;margin-bottom:16px"><span class="logo" style="width:56px;height:56px"></span><h2 style="margin:8px 0 0">Trading Journal</h2></div><div class="card"><h3>${n?'Create your account':'Sign in'}</h3>
 <label>Username</label><input id="au_u" autocomplete="username" autocapitalize="none"><label style="margin-top:10px">Password (8+ characters)</label><input id="au_p" type="password" autocomplete="${n?'new-password':'current-password'}" onkeydown="if(event.key==='Enter')authSubmit('${mode}')">
 ${n?'<label style="margin-top:10px">Confirm password</label><input id="au_c" type="password" autocomplete="new-password" onkeydown="if(event.key===\'Enter\')authSubmit(\'new\')">':''}
 <p id="au_e" class="warn" style="min-height:16px"></p><button id="au_b" style="width:100%" onclick="authSubmit('${mode}')">${n?'Create account':'Sign in'}</button>
 <p style="text-align:center;margin:12px 0 0;font-size:13px"><a style="color:var(--primary);cursor:pointer" onclick="vAuth('${n?'in':'new'}')">${n?'Already have an account? Sign in':'New here? Create an account'}</a></p></div>
 <p style="color:var(--muted);font-size:12px">Accounts are stored <b>only in this browser</b> and your data is encrypted with your password. Nothing is sent to a server, so it won't sync between devices, and a forgotten password can't be recovered. Use Settings → Export backup to move or protect your data.</p></div>`}
async function authSubmit(mode){const u=$('#au_u').value.trim(),pw=$('#au_p').value,err=m=>{$('#au_e').textContent=m};
 if(u.length<3)return err('Username must be at least 3 characters.');if(pw.length<8)return err('Password must be at least 8 characters.');
 const id=u.toLowerCase(),btn=$('#au_b');btn.disabled=true;btn.textContent='Please wait…';err('');
 try{const rec=await kv('get','u:'+id);
  if(mode==='new'){if(rec)return err('That username already exists on this device.');if(pw!==$('#au_c').value)return err('Passwords do not match.');SALT=crypto.getRandomValues(new Uint8Array(16));KEY=await derive(pw,SALT);USER=id;USERD=u;Object.keys(MEM).forEach(k=>delete MEM[k]);await seal()}
  else{if(!rec)return err('No account with that username on this device. Create one first.');const k=await derive(pw,rec.salt);let st;try{st=JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:rec.iv},k,rec.ct)))}catch(e){return err('Wrong password.')}KEY=k;SALT=rec.salt;USER=id;USERD=rec.name||u;Object.keys(MEM).forEach(x=>delete MEM[x]);Object.assign(MEM,st)}
  $('#auth').remove();initStore()}
 catch(e){err('Browser storage or encryption is unavailable here ('+(e.message||e)+').');KEY=null}
 finally{const b=$('#au_b');if(b){b.disabled=false;b.textContent=mode==='new'?'Create account':'Sign in'}}}
